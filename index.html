<!doctype html>
<!--
  Choices for this teaching tool:

  - Source is TypeScript. esbuild writes the embed as
    dist/cfd-tutorial-<version>.js (IIFE, minified, with a source map). The
    version comes from package.json. Vite serves this page in development and
    is not part of the bundle. Dev dependencies only; the bundle has no framework.
  - window.CFD_CONFIG is read once when the bundle loads. CFD.mount(override)
    merges an override onto that snapshot. The only global the bundle adds is
    window.CFD.
  - The host supplies one element. This page fills it with a loading
    placeholder until mount removes [data-cfd-loading]. The bundle appends a
    style tag and an inner root with class cfd. Every color, size, radius,
    and font default lives on .cfd. Rules are class selectors under .cfd.
  - cfd-resize fires on window load, or on a timeout if the document is already
    loaded, so a listener in a script after the bundle still receives it.
    detail.height is the inner root's scrollHeight. The chart and board
    minimums give that height when the host container is unsized.
  - Below 640×480 the tool still renders and logs one console.warn per mount.
  - pnpm preview serves dist/. The build copies embed.html to dist/index.html
    and rewrites the script src to cfd-tutorial-<version>.js. pnpm watch
    rebuilds the bundle and does not copy embed.html again; run pnpm build
    after editing that file.
  - The published bundle name includes the package version, for example
    cfd-tutorial-1.0.0.js. The preview page uses that same name.
  - The shell is a header (title and brand HTML), a flex row at 2:1 (chart
    over board, the sample spreadsheet), and a footer. The sample select loads
    one of four embedded CSVs, returns to day 0, clears the glow and a Little's
    Law drag, and dispatches cfd-resize again. It does not reset Hide done.
    Playback starts at day 0.
    Play advances one day per frame (1× is one second). Step and reset pause
    playback. The current row uses --color-highlight as a fill.
    A selected count or card uses a 1px ink line with a short soft halo.
    Cards are synthetic and FIFO: card 1 is the oldest, and it sits in the
    rightmost state whose reached total includes it. Each note is 5.5rem wide,
    filled with that state's chart color, and labeled "Card N". Done cards and
    that column use overflow hidden. Columns carry a 16% wash of the same
    color, 28% when selected. The board shows columns with no cards at day 0.
    A card slides when its state changes. The chart is
    empty at day 0. From day 1 it stacks one rectangle per state per day through
    the playhead, Done on the axis, in a 0–100 viewBox inset to 8,6–98,92. X
    slots cover the whole sample. Y uses the tallest visible total in the
    sample. Band colors are the lighter --color-chart-1 through 4, read from
    the root's computed style. Hide done drops the Done band on the chart only
    and dispatches cfd-resize. Once more than two days are visible, a drag
    from one day to another draws Little's Law. The earlier day is startDay.
    arrivalRate joins the top of the stack on startDay to the top on endDay.
    departureRate joins the tops of the Done bands, and is drawn only when
    both days have one. wip is vertical on startDay, from the top of the stack
    down to Done, or to the baseline when that day has no Done band.
    approximateCycleTime runs right from startDay's top until a later visible
    day whose Done top reaches that height. If none does, the line is dashed
    and stops on the playhead. The lines are labeled Approx. Avg. Arrival
    Rate, Approx. Avg. Throughput (the departure line), WIP, and Approx. Avg.
    Cycle Time. Play, Back, Forward, and Reset keep the dragged
    days and redraw the lines for the days on screen. The rate chords are
    hidden while endDay is not visible, and they return at the same slope
    when it is. Hide done hides the Little's Law lines and keeps the dragged
    days, so turning it off draws them again. A plain chart click or Escape
    clears the drag. Click a band,
    a count, or a card to share one selection on
    {day, state}. The chart deepens that day's fill. The slice keeps
    tabindex for the keyboard, and its focus outline is cleared.
    A click in the table or the chart leaves the playhead where it is.
    A day-label click clears the state selection. A day column is
    the row label. Every other column is a
    state, left to right, and the last column is Done. Border thickness is
    the --border-width token. Flex grow is 2 and 1.
-->
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Cumulative Flow</title>
	<style>
		.cfd-loading {
			position: relative;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #ffffff;
			color: #1c1917;
			font-family: ui-sans-serif, system-ui, sans-serif;
		}

		.cfd-loading * {
			box-sizing: border-box;
		}

		.cfd-loading-label {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		.cfd-loading-header,
		.cfd-loading-footer {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			padding: 0.75rem 1rem;
		}

		.cfd-loading-header {
			border-bottom: 1px solid #e7e5e4;
		}

		.cfd-loading-footer {
			border-top: 1px solid #e7e5e4;
		}

		.cfd-loading-main {
			display: flex;
			flex: 1 1 auto;
			gap: 1rem;
			min-height: 0;
			padding: 1rem;
		}

		.cfd-loading-stack {
			display: flex;
			flex: 2 1 0;
			flex-direction: column;
			gap: 1rem;
			min-width: 0;
		}

		.cfd-loading-chart,
		.cfd-loading-board,
		.cfd-loading-sheet {
			border: 1px solid #e7e5e4;
			border-radius: 0.375rem;
		}

		.cfd-loading-chart {
			display: flex;
			flex: 1 1 auto;
			align-items: center;
			justify-content: center;
			min-height: 16rem;
		}

		.cfd-loading-board {
			display: flex;
			flex: 1 1 auto;
			gap: 0.5rem;
			min-height: 12rem;
			padding: 0.5rem;
		}

		.cfd-loading-lane {
			flex: 1 1 0;
			min-width: 0;
			border-radius: 0.375rem;
			background: #f5f5f4;
		}

		.cfd-loading-sheet {
			display: flex;
			flex: 1 1 0;
			flex-direction: column;
			gap: 0.5rem;
			min-width: 0;
			padding: 0.5rem;
		}

		.cfd-loading-bar {
			display: block;
			height: 0.75rem;
			border-radius: 0.375rem;
			background: #f5f5f4;
		}

		.cfd-loading-bar.title {
			width: 8rem;
			height: 1.125rem;
		}

		.cfd-loading-bar.brand {
			width: 5rem;
			height: 0.875rem;
		}

		.cfd-loading-bar.head {
			width: 70%;
		}

		.cfd-loading-bar.row {
			width: 100%;
		}

		.cfd-loading-bar.status {
			width: 6rem;
		}

		.cfd-loading-bar.copyright {
			width: 8rem;
		}

		.cfd-loading-pills {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0.5rem;
		}

		.cfd-loading-pill {
			display: block;
			width: 4rem;
			height: 2.25rem;
			border: 1px solid #e7e5e4;
			border-radius: 0.375rem;
			background: #f5f5f4;
		}

		.cfd-loading-spinner {
			width: 1.25rem;
			height: 1.25rem;
			border: 2px solid #e7e5e4;
			border-top-color: #1c1917;
			border-radius: 50%;
			animation: cfd-spin 0.8s linear infinite;
		}

		@keyframes cfd-spin {
			to {
				transform: rotate(360deg);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.cfd-loading-spinner {
				animation: none;
			}
		}
	</style>
</head>

<body>
	<div id="cfd-tutorial" style="height: 640px">
		<div class="cfd-loading" data-cfd-loading role="status">
			<span class="cfd-loading-label">Loading Cumulative Flow</span>
			<div class="cfd-loading-header" aria-hidden="true">
				<span class="cfd-loading-bar title"></span>
				<span class="cfd-loading-bar brand"></span>
			</div>
			<div class="cfd-loading-main">
				<div class="cfd-loading-stack">
					<div class="cfd-loading-chart" aria-hidden="true">
						<span class="cfd-loading-spinner"></span>
					</div>
					<div class="cfd-loading-board" aria-hidden="true">
						<span class="cfd-loading-lane"></span>
						<span class="cfd-loading-lane"></span>
						<span class="cfd-loading-lane"></span>
						<span class="cfd-loading-lane"></span>
					</div>
				</div>
				<div class="cfd-loading-sheet" aria-hidden="true">
					<span class="cfd-loading-bar head"></span>
					<span class="cfd-loading-bar row"></span>
					<span class="cfd-loading-bar row"></span>
					<span class="cfd-loading-bar row"></span>
					<span class="cfd-loading-bar row"></span>
					<span class="cfd-loading-bar row"></span>
					<span class="cfd-loading-bar row"></span>
				</div>
			</div>
			<div class="cfd-loading-footer" aria-hidden="true">
				<div class="cfd-loading-pills">
					<span class="cfd-loading-pill"></span>
					<span class="cfd-loading-pill"></span>
					<span class="cfd-loading-pill"></span>
					<span class="cfd-loading-pill"></span>
					<span class="cfd-loading-bar status"></span>
				</div>
				<span class="cfd-loading-bar copyright"></span>
			</div>
		</div>
	</div>
	<script>
		window.CFD_CONFIG = {
			container: "#cfd-tutorial",
			brand: "<strong>Your Brand</strong>",
			copyright: "© 2026 Your Company",
			sample: "balanced-flow",
		};
	</script>
	<script type="module" src="/src/ts/cfd-tutorial.ts"></script>
	<script>
		document.getElementById("cfd-tutorial").addEventListener("cfd-resize", (e) => {
			e.currentTarget.style.height = e.detail.height + "px";
		});
	</script>
</body>

</html>
