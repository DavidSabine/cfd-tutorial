<!doctype html>
<!--
  Choices for this teaching tool:

  - Source is TypeScript. esbuild writes the embed as
    dist/cfd-tutorial-<version>.js (IIFE, minified, with a source map). The
    version comes from package.json. Vite serves this page in development and
    is not part of the bundle. Dev dependencies only; the bundle has no framework.
  - window.CFD_CONFIG is read once when the bundle loads. CFD.mount(override)
    merges an override onto that snapshot. The only global the bundle adds is
    window.CFD.
  - The host supplies one empty element. The bundle appends a style tag and an
    inner root with class cfd. Every color, size, radius, and font default lives
    on .cfd. Rules are class selectors under .cfd.
  - cfd-resize fires on window load, or on a timeout if the document is already
    loaded, so a listener in a script after the bundle still receives it.
    detail.height is the inner root's scrollHeight. The chart and board
    minimums give that height when the host container is unsized.
  - Below 640×480 the tool still renders and logs one console.warn per mount.
  - pnpm preview serves dist/. The build copies embed.html to dist/index.html
    and rewrites the script src to cfd-tutorial-<version>.js. pnpm watch
    rebuilds the bundle and does not copy embed.html again; run pnpm build
    after editing that file.
  - The published bundle name includes the package version, for example
    cfd-tutorial-1.0.0.js. The preview page uses that same name.
  - The shell is a header (title and brand HTML), a flex row at 2:1 (chart
    over board, the sample spreadsheet), and a footer. The sample select loads
    one of four embedded CSVs, returns to day 0, clears the glow, and dispatches
    cfd-resize again. It does not reset Hide done. Playback starts at day 0.
    Play advances one day per frame (1× is one second). Step and reset pause
    playback. The current row uses --color-highlight as a fill.
    A selected count or card uses a 1px ink line with a short soft halo.
    Cards are synthetic and FIFO: card 1 is the oldest, and it sits in the
    rightmost state whose reached total includes it. Each note is 5.5rem wide,
    filled with that state's chart color, and labeled "Card N". Done cards and
    that column use overflow hidden. Columns carry a 16% wash of the same
    color, 28% when selected. The board shows columns with no cards at day 0.
    A card slides when its state changes. The chart is
    empty at day 0. From day 1 it stacks one rectangle per state per day through
    the playhead, Done on the axis, in a 0–100 viewBox inset to 8,6–98,92. X
    slots cover the whole sample. Y uses the tallest visible total in the
    sample. Band colors are the lighter --color-chart-1 through 4, read from
    the root's computed style. The action color is ink, separate from the
    bands. Hide done drops the Done band on the chart only and dispatches
    cfd-resize. Click a band, a count, or a card to share one selection on
    {day, state}. The chart deepens that day's fill. The slice keeps
    tabindex for the keyboard, and its focus outline is cleared.
    A click in the table or the chart leaves the playhead where it is.
    A day-label click clears the state selection. A day column is
    the row label. Every other column is a
    state, left to right, and the last column is Done. Border thickness is
    the --border-width token. Flex grow is 2 and 1.
-->
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Cumulative Flow</title>
</head>

<body>
	<div id="cfd-tutorial" style="height: 640px"></div>
	<script>
		window.CFD_CONFIG = {
			container: "#cfd-tutorial",
			brand: "<strong>Your Brand</strong>",
			copyright: "© 2026 Your Company",
			sample: "balanced-flow",
		};
	</script>
	<script type="module" src="/src/ts/cfd-tutorial.ts"></script>
	<script>
		document.getElementById("cfd-tutorial").addEventListener("cfd-resize", (e) => {
			e.currentTarget.style.height = e.detail.height + "px";
		});
	</script>
</body>

</html>
